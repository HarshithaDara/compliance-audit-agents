apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: {app: gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway, app.kubernetes.io/component: api}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: audit-gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: audit-config}}]
          env:  # only checked, never used here: the Claude reader is offered when a key exists
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: anthropic, key: api-key, optional: true}}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /livez, port: 8000}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}  # holds one upload (MAX_UPLOAD_MB) while storing it
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector: {app: gateway}
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
