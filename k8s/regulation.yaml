apiVersion: apps/v1
kind: Deployment
metadata:
  name: regulation
  labels: {app: regulation}
spec:
  replicas: 1
  selector:
    matchLabels: {app: regulation}
  template:
    metadata:
      labels: {app: regulation, app.kubernetes.io/component: agent}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: regulation
          image: audit-regulation:latest
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: audit-config}}]
          livenessProbe:
            exec:
              command: ["python", "-c", "import os,sys,time; sys.exit(time.time()-os.path.getmtime('/tmp/agent-healthy')>60)"]
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
